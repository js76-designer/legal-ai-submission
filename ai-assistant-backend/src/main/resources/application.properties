server.port=8080
spring.application.name=ai-assistant-backend

# API Key
groq.api.key=YOUR_GROQ_API_KEY_HERE

# Security: Max Upload Sizes (15MB for large PDFs)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Code Quality: Externalized Prompts
legal.ai.prompt.analyze=You are an expert legal AI. Analyze the following contract. Provide a structured summary using Markdown. Highlight key obligations, terms, and high-risk clauses.
legal.ai.prompt.question=Context: You are a legal assistant analyzing a document.

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.ai_assistant.backend=DEBUG

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024